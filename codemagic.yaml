workflows:
  female-car-user-ios:
    name: Female Car User iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Banuvra-iOS-Package
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.femalecaruserr.eon
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Clean and reinstall CocoaPods dependencies
        script: |
          cd ios
          rm -rf Pods .symlinks Flutter/Flutter.podspec Podfile.lock
          pod install --repo-update
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
