name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Artifact to build
        required: true
        type: choice
        options:
          - apk
          - aab
          - both
        default: aab
      update_version:
        description: Set the Flutter version from today's date and the workflow run number
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    env:
      TZ: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build metadata
        id: metadata
        shell: bash
        run: |
          BUILD_DATE="$(date +'%Y-%m-%d')"
          VERSION_DATE="$(date +'%Y.%m.%d')"
          VERSION="${VERSION_DATE}+${GITHUB_RUN_NUMBER}"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=${BUILD_DATE}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Update Flutter version
        if: ${{ inputs.update_version }}
        shell: bash
        run: |
          sed -i -E "s/^version:.*/version: ${{ steps.metadata.outputs.version }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          fi

          if [[ ! -f android/app/keystore.jks ]]; then
            echo 'Missing android/app/keystore.jks. Add the Android signing secrets to this repository.'
            exit 1
          fi

      - name: Build APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: flutter build apk --release

      - name: Build AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        run: flutter build appbundle --release

      - name: Rename build outputs
        shell: bash
        run: |
          SUFFIX="${{ steps.metadata.outputs.artifact_suffix }}"

          if [[ "${{ inputs.build_type }}" == "apk" || "${{ inputs.build_type }}" == "both" ]]; then
            mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/female-car-apk-${SUFFIX}.apk"
          fi

          if [[ "${{ inputs.build_type }}" == "aab" || "${{ inputs.build_type }}" == "both" ]]; then
            mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/female-car-aab-${SUFFIX}.aab"
          fi

      - name: Upload APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: female-car-apk-${{ steps.metadata.outputs.artifact_suffix }}
          path: build/app/outputs/flutter-apk/female-car-apk-*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: female-car-aab-${{ steps.metadata.outputs.artifact_suffix }}
          path: build/app/outputs/bundle/release/female-car-aab-*.aab
          if-no-files-found: error
